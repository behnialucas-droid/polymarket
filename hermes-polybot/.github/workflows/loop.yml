name: Autonomous Hermes Polybot Cloud Loop

on:
  schedule:
    - cron: '*/5 * * * *' # Every 5 minutes
  workflow_dispatch: # Allow manual trigger

jobs:
  run-cycle:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Run Autonomous Cycle
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL || 'postgresql://postgres.yywcdqgbilwbuifnbidz:0g30C4hNlkAPtt9Y@aws-0-eu-west-1.pooler.supabase.com:5432/postgres' }}
          DIRECT_URL: ${{ secrets.DIRECT_URL || 'postgresql://postgres.yywcdqgbilwbuifnbidz:0g30C4hNlkAPtt9Y@aws-0-eu-west-1.pooler.supabase.com:5432/postgres' }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || '7968301266:AAEgrLkq01Q8k-OdCuDRu16pz0iVRafoAFw' }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || '5708853617' }}
          DATA_SOURCE: live
          LEADERBOARD_LIMIT: 500
          WALLET_SCAN_LIMIT: 500
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/loop-once.ts
