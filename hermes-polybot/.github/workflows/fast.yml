name: fast

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes (disabled by default on public GHA runners unless RUNNER_LABEL is self-hosted)
  workflow_dispatch:

defaults:
  run:
    working-directory: runtime

permissions:
  contents: read

jobs:
  fast-cycle:
    # Requires self-hosted or dedicated runner label to avoid consuming public GHA minute quota
    if: github.repository_owner == 'behnialucas-droid' && vars.FAST_CYCLES_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      PM_MIN_INTERVAL_MS: ${{ vars.PM_MIN_INTERVAL_MS }}
      PM_MAX_CONCURRENT:  ${{ vars.PM_MAX_CONCURRENT }}
      WALLET_SCAN_LIMIT:  '10'

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
          cache-dependency-path: runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run fast cycle
        run: npm run cycle
