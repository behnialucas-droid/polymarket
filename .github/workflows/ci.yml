name: ci

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

defaults:
  run:
    working-directory: hermes-polybot/runtime

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
          cache-dependency-path: hermes-polybot/runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run test suite
        run: npm test
