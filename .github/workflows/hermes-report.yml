name: hermes-report

on:
  schedule:
    - cron: '0,30 * * * *'  # Every 30 minutes — :00 and :30 past each hour
  workflow_dispatch:

defaults:
  run:
    working-directory: hermes-polybot/runtime

permissions:
  contents: read

concurrency:
  group: hermes-report
  cancel-in-progress: false

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      DATABASE_URL:            ${{ secrets.DATABASE_URL }}
      DIRECT_URL:              ${{ secrets.DIRECT_URL }}
      TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
      WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
      DATA_SOURCE:             live
      LEADERBOARD_LIMIT:       '500'
      WALLET_SCAN_LIMIT:       '500'
      RESCAN_ENABLED:          'true'
      RESCAN_INTERVAL_DAYS:    '30'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermes-polybot/runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run 30-minute report and send Telegram
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/report-hourly.ts
