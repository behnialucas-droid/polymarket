name: hermes-keepalive

on:
  schedule:
    - cron: '41 5 * * *'   # 05:41 UTC daily - prevent GHA 60-day auto-disable
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Touch keepalive stamp
        run: |
          date -u +"%Y-%m-%dT%H:%M:%SZ" > .keepalive
          git config user.name "hermes-bot"
          git config user.email "hermes-bot@users.noreply.github.com"
          git add .keepalive
          git diff --quiet && git diff --staged --quiet || (git commit -m "chore: keepalive [skip ci]" && git push)
