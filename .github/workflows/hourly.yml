name: hourly

on:
  schedule:
    - cron: '17 * * * *'   # :17 UTC — top-of-hour is the most contended minute on GHA
  workflow_dispatch:

defaults:
  run:
    working-directory: hermes-polybot/runtime

permissions:
  contents: read           # this job must NEVER push to git
  actions: write           # required for self-dispatching rescan.yml when due

concurrency:
  group: hermes-hourly
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      DATABASE_URL:            ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
      WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
      CYCLE_ENABLED:           ${{ vars.CYCLE_ENABLED }}
      RESCAN_ENABLED:          ${{ vars.RESCAN_ENABLED }}
      RESCAN_INTERVAL_DAYS:    ${{ vars.RESCAN_INTERVAL_DAYS }}
      PM_MIN_INTERVAL_MS:      ${{ vars.PM_MIN_INTERVAL_MS }}
      PM_MAX_CONCURRENT:       ${{ vars.PM_MAX_CONCURRENT }}
      LEADERBOARD_LIMIT:       ${{ vars.LEADERBOARD_LIMIT }}
      WALLET_SCAN_LIMIT:       ${{ vars.WALLET_SCAN_LIMIT }}
      REPORT_TZ:               ${{ vars.REPORT_TZ }}

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
          cache-dependency-path: hermes-polybot/runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run cycle
        run: npm run cycle

      - name: Run hourly report and watchdog
        if: always()        # Report ALWAYS sends, even when cycle failed
        run: npm run report
