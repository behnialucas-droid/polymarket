name: fast

on:
  schedule:
    - cron: '*/15 * * * *'   # Every 15 minutes — synced with 15m dashboard & report cadence
  workflow_dispatch:

defaults:
  run:
    working-directory: hermes-polybot/runtime

permissions:
  contents: read
  actions: write           # needed for rescan dispatch when due

concurrency:
  group: hermes-fast
  cancel-in-progress: true   # Skip pile-ups if previous run takes > 15m

jobs:
  fast-cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      DATABASE_URL:            ${{ secrets.DATABASE_URL }}
      TELEGRAM_BOT_TOKEN:      ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:        ${{ secrets.TELEGRAM_CHAT_ID }}
      WORKFLOW_DISPATCH_TOKEN: ${{ secrets.WORKFLOW_DISPATCH_TOKEN }}
      PM_MIN_INTERVAL_MS:      ${{ vars.PM_MIN_INTERVAL_MS }}
      PM_MAX_CONCURRENT:       ${{ vars.PM_MAX_CONCURRENT }}
      WALLET_SCAN_LIMIT:       '20'
      CYCLE_ENABLED:           'true'
      RESCAN_ENABLED:          'true'
      RESCAN_INTERVAL_DAYS:    '30'
      REPORT_TZ:               'UTC'
      CYCLE_MAX_AGE_MIN:       '45'   # 45-min threshold for 15-min cadence

    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 1 }

      - uses: actions/setup-node@v4
        with:
          node-version: '22.11'
          cache: npm
          cache-dependency-path: hermes-polybot/runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run fast cycle
        run: npm run cycle

      - name: Run fast report (Telegram)
        if: always()        # Always send report even if cycle failed
        run: npm run report
