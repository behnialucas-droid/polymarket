name: hermes-bot

on:
  schedule:
    - cron: '*/5 * * * *'   # Every 5 minutes — bot monitoring cycle
  workflow_dispatch:

defaults:
  run:
    working-directory: hermes-polybot/runtime

permissions:
  contents: read

concurrency:
  group: hermes-cycle
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    env:
      DATABASE_URL:       ${{ secrets.DATABASE_URL }}
      DIRECT_URL:         ${{ secrets.DIRECT_URL }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
      DATA_SOURCE:        live
      LEADERBOARD_LIMIT:  '500'
      WALLET_SCAN_LIMIT:  '500'
      CYCLE_ENABLED:      'true'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: hermes-polybot/runtime/package-lock.json

      - name: Install runtime dependencies
        run: npm ci --no-audit --no-fund

      - name: Run monitoring cycle
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/cycle.ts
